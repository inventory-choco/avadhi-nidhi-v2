<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Avadhi Nidhi Loan Request</title>
  
  <!-- jsPDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --primary: #0066cc;
      --light: #f4f8fc;
      --border: #d6e2f1;
      --bg: #ffffff;
      --text: #000000;
      --radius: 10px;
      --error: #ffcccc;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #0b1220; /* Matching your Dashboard theme */
      color: var(--text);
      margin: 0;
      padding: 15px;
    }

    form {
      max-width: 700px;
      background: var(--light);
      margin: auto;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h2 {
      text-align: center;
      color: var(--primary);
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
      color: #333;
    }

    /* Fix: Ensuring Date Picker is visible and clickable on PC */
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 16px; /* Prevents iOS auto-zoom */
      background-color: #fff;
      color: #000;
      box-sizing: border-box;
    }

    input[type="date"] {
      min-height: 45px;
      cursor: pointer;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    .readonly {
      background: #e9f1fc;
      pointer-events: none;
    }

    .summary {
      background: #fff9db;
      border-left: 5px solid #f1c40f;
      padding: 15px;
      margin-top: 20px;
      font-size: 0.95rem;
      border-radius: var(--radius);
      white-space: pre-line;
      color: #333;
    }

    #signatureCanvas {
      border: 1px solid var(--border);
      background-color: #fff;
      border-radius: var(--radius);
      margin-top: 10px;
      touch-action: none; /* Crucial for mobile drawing */
      display: block;
      width: 100%;
      max-width: 400px;
      height: 180px;
    }

    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      min-width: 140px;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: var(--radius);
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:active { opacity: 0.8; }
    button.secondary { background: #555; }
    button.whatsapp { background: #25D366; color: white; }

    .error-message { color: red; font-size: 12px; margin-top: 5px; }
    .hidden { display: none; }

    @media (max-width: 480px) {
      form { padding: 15px; }
      .button-row button { flex: 1 1 100%; }
    }
  </style>
</head>
<body>

  <form id="loanForm">
    <h2>Avadhi Nidhi Loan Request</h2>

    <label>Request Date</label>
    <input type="text" id="requestDate" class="readonly" readonly>

    <label>Applicant Name</label>
    <input type="text" id="name" required placeholder="Enter full name">

    <label>Contact Number UAE</label>
    <div class="input-row">
      <input type="text" value="+971" readonly style="max-width: 70px;">
      <input type="tel" id="contactUAE" placeholder="5x xxx xxxx" maxlength="9" required>
    </div>

    <label>Contact Number India (optional)</label>
    <div class="input-row">
      <input type="text" value="+91" readonly style="max-width: 70px;">
      <input type="tel" id="contactIndia" maxlength="10">
    </div>

    <label>Requesting Loan Amount (AED, Max 2000)</label>
    <input type="number" id="amount" step="100" required>
    <div id="amountError" class="error-message hidden">Maximum allowed amount is 2000</div>

    <label>Loan Required By Date</label>
    <input type="date" id="loanDate" required>

    <label>Reason for Loan Request</label>
    <select id="reason" required>
      <option value="">-- Select --</option>
      <option value="Annual Leave">Annual Leave</option>
      <option value="Emergency Leave">Emergency Leave</option>
      <option value="Other">Other</option>
    </select>

    <div id="otherReasonDiv" class="hidden">
      <label>Please specify reason</label>
      <input type="text" id="otherReason">
    </div>

    <label>Repayment Months (Max 5)</label>
    <input type="number" id="months" max="5" min="1" required>

    <label>Loan Repayment Starting Date</label>
    <input type="date" id="repayStart" required>

    <label>Loan Repayment End Date</label>
    <input type="date" id="repayEnd" required>

    <div class="summary" id="summaryMessage"></div>

    <label>Draw Signature</label>
    <canvas id="signatureCanvas"></canvas>
    <button type="button" class="secondary" style="margin-top:10px; width:auto; flex:none;" onclick="clearSignature()">Clear Signature</button>

    <div class="button-row">
      <button type="button" onclick="downloadPDF()">Download PDF</button>
      <button type="button" class="whatsapp" onclick="shareOnWhatsApp()">WhatsApp Share</button>
      <button type="button" class="secondary" onclick="window.print()">Print</button>
      <button type="reset" class="secondary" onclick="resetForm()">Clear Form</button>
    </div>
  </form>

  <script>
    const { jsPDF } = window.jspdf;
    let canvas, ctx, drawing = false;

    // --- Signature Setup ---
    function initCanvas() {
      canvas = document.getElementById("signatureCanvas");
      ctx = canvas.getContext("2d");
      
      // Fixed: Only set internal resolution once to prevent clearing on scroll
      if (canvas.width === 300) return; 

      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      
      ctx.lineWidth = 2;
      ctx.lineCap = "round";
      ctx.strokeStyle = "#000";
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDraw(e) {
      e.preventDefault();
      drawing = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function doDraw(e) {
      if (!drawing) return;
      e.preventDefault();
      const pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDraw() { drawing = false; }

    function clearSignature() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function isCanvasEmpty() {
      const blank = document.createElement('canvas');
      blank.width = canvas.width;
      blank.height = canvas.height;
      return canvas.toDataURL() === blank.toDataURL();
    }

    // --- Form Logic ---
    function autoSetDates() {
      const loanDateInput = document.getElementById('loanDate');
      const monthsInput = document.getElementById('months');
      const repayStart = document.getElementById('repayStart');
      const repayEnd = document.getElementById('repayEnd');

      if (loanDateInput.value && monthsInput.value > 0) {
        const start = new Date(loanDateInput.value);
        start.setMonth(start.getMonth() + 2); // 2-month grace
        repayStart.valueAsDate = start;

        const end = new Date(start);
        end.setMonth(end.getMonth() + parseInt(monthsInput.value));
        repayEnd.valueAsDate = end;
      }
      generateSummary();
    }

    function generateSummary() {
      const name = document.getElementById('name').value;
      const amount = document.getElementById('amount').value;
      const lDate = document.getElementById('loanDate').value;
      const reason = document.getElementById('reason').value === 'Other' ? document.getElementById('otherReason').value : document.getElementById('reason').value;
      const endDate = document.getElementById('repayEnd').value;

      if (!name || !amount || !lDate || !endDate) return;

      document.getElementById('summaryMessage').innerText = 
`Dear Avadhi Nidhi Committee,

I would like to request for a loan of AED ${amount} on ${lDate} for ${reason || '...'}.
I will repay the loan amount completely by ${endDate}.

Kindly approve my request.

Requested By,
${name}`;
    }

    function resetForm() {
      setTimeout(() => {
        clearSignature();
        document.getElementById('summaryMessage').innerText = "";
        document.getElementById('requestDate').value = new Date().toISOString().split("T")[0];
      }, 10);
    }

    // --- PDF & Export ---
    function downloadPDF() {
      if (!document.getElementById('name').value || isCanvasEmpty()) {
        alert("Please fill name and provide signature.");
        return;
      }

      const doc = new jsPDF();
      const name = document.getElementById('name').value;
      const reqDate = document.getElementById('requestDate').value;
      const contactUAE = "+971 " + document.getElementById('contactUAE').value;
      const amount = document.getElementById('amount').value;
      const reason = document.getElementById('reason').value === 'Other' ? document.getElementById('otherReason').value : document.getElementById('reason').value;
      const months = document.getElementById('months').value;
      const rStart = document.getElementById('repayStart').value;
      const rEnd = document.getElementById('repayEnd').value;
      const summary = document.getElementById('summaryMessage').innerText;

      // Header
      doc.setFontSize(18);
      doc.setTextColor(0, 102, 204);
      doc.text("Avadhi Nidhi Loan Request", 105, 20, { align: "center" });

      // Body
      doc.setFontSize(12);
      doc.setTextColor(0, 0, 0);
      let y = 40;
      const left = 20, right = 80;

      const addRow = (label, value) => {
        doc.setFont("helvetica", "bold");
        doc.text(label, left, y);
        doc.setFont("helvetica", "normal");
        doc.text(String(value), right, y);
        y += 10;
      };

      addRow("Request Date:", reqDate);
      addRow("Applicant Name:", name);
      addRow("Contact UAE:", contactUAE);
      addRow("Loan Amount:", "AED " + amount);
      addRow("Reason:", reason);
      addRow("Repay Months:", months);
      addRow("Start Date:", rStart);
      addRow("End Date:", rEnd);
      
      y += 5;
      doc.setFont("helvetica", "bold");
      doc.text("Summary:", left, y);
      y += 7;
      doc.setFont("helvetica", "normal");
      const splitText = doc.splitTextToSize(summary, 170);
      doc.text(splitText, left, y);
      
      y += (splitText.length * 7) + 10;
      doc.text("Signature:", left, y);
      doc.addImage(canvas.toDataURL("image/png"), 'PNG', left, y + 5, 50, 20);

      doc.save(`Avadhi_Loan_${name.replace(/\s+/g, '_')}.pdf`);
    }

    function shareOnWhatsApp() {
      const name = document.getElementById('name').value;
      const amount = document.getElementById('amount').value;
      if (!name || !amount) { alert("Fill the form first"); return; }
      
      const text = encodeURIComponent(`Avadhi Nidhi Loan Request\nName: ${name}\nAmount: AED ${amount}\nRepayment ends: ${document.getElementById('repayEnd').value}`);
      window.open(`https://wa.me/?text=${text}`);
    }

    // --- Init ---
    window.onload = () => {
      initCanvas();
      document.getElementById('requestDate').value = new Date().toISOString().split("T")[0];

      // Signature Listeners
      canvas.addEventListener("mousedown", startDraw);
      canvas.addEventListener("mousemove", doDraw);
      window.addEventListener("mouseup", stopDraw);

      canvas.addEventListener("touchstart", startDraw, { passive: false });
      canvas.addEventListener("touchmove", doDraw, { passive: false });
      window.addEventListener("touchend", stopDraw);

      // Input Listeners
      document.getElementById('amount').oninput = function() {
        document.getElementById('amountError').classList.toggle('hidden', this.value <= 2000);
        generateSummary();
      };
      document.getElementById('loanDate').onchange = autoSetDates;
      document.getElementById('months').oninput = autoSetDates;
      document.getElementById('name').oninput = generateSummary;
      document.getElementById('reason').onchange = function() {
        document.getElementById('otherReasonDiv').classList.toggle('hidden', this.value !== 'Other');
        generateSummary();
      };
      document.getElementById('repayStart').onchange = generateSummary;
      document.getElementById('repayEnd').onchange = generateSummary;
    };
  </script>
</body>
</html>
