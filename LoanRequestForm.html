<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Avadhi Nidhi Loan Request</title>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{
  --bg:#0b1220;
  --card:#101a33;
  --border:rgba(255,255,255,.15);
  --primary:#6ea8fe;
  --text:#ffffff;
  --muted:#b5b5b5;
  --error:#ff6b6b;
  --radius:14px;
  --shadow:0 12px 30px rgba(0,0,0,.35);
}

body{
  margin:0;
  padding:20px;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}

form{
  max-width:780px;
  margin:auto;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:22px;
  box-shadow:var(--shadow);
}

h2{ text-align:center; margin-bottom:10px; }

label{ display:block; margin-top:14px; font-weight:600; }

input,select{
  width:100%;
  padding:10px;
  margin-top:4px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#0b1220;
  color:var(--text);
  font-size:14px;
  box-sizing: border-box;
}

.input-row{ display:flex; gap:10px; }
.readonly{ background:#121a2f; }
small{ color:var(--muted); display:block; margin-top:6px; }
.error-message{ color:var(--error); font-size:12px; margin-top:4px; }
.hidden{display:none}

.summary{
  background:#0e1730;
  border-left:4px solid var(--primary);
  padding:12px;
  margin-top:16px;
  border-radius:10px;
  white-space:pre-line;
}

/* Fixed Canvas Styling */
#signatureCanvas {
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-top: 10px;
  width: 100%;
  height: 200px;
  background: #fff;
  touch-action: none; /* Prevents scrolling while drawing */
  display: block;
}

.button-row{
  display:flex;
  gap:10px;
  margin-top:20px;
  flex-wrap:wrap;
}

button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:12px;
  background:var(--primary);
  color:#000;
  font-weight:700;
  cursor:pointer;
}

button.secondary{ background:#2a3558; color:#fff; }

@media(max-width:600px){
  button{font-size:14px}
}
</style>
</head>

<body>

<form id="loanForm">
  <h2>Avadhi Nidhi Loan Request</h2>

  <label>Request Date</label>
  <input id="requestDate" class="readonly" readonly>

  <label>Applicant Name</label>
  <input id="applicantName" required placeholder="Enter full name">

  <label>Contact Number (UAE)</label>
  <div class="input-row">
    <input value="+971" readonly style="max-width:70px">
    <input id="contactUAE" maxlength="9" placeholder="5x xxx xxxx">
  </div>

  <label>Loan Amount (Max AED 2000)</label>
  <input type="number" id="amount" step="100" required>
  <div id="amountError" class="error-message hidden">Maximum allowed amount is 2000</div>

  <label>Loan Required By Date</label>
  <input type="date" id="loanDate" required>

  <label>Reason</label>
  <select id="reason" required>
    <option value="">Select</option>
    <option>Annual Leave</option>
    <option>Emergency Leave</option>
    <option>Other</option>
  </select>

  <div id="otherReasonDiv" class="hidden">
    <label>Please specify</label>
    <input id="otherReason">
  </div>

  <label>Repayment Months (Max 5)</label>
  <input type="number" id="months" min="1" max="5" required>

  <div id="emiPreview" class="summary hidden"></div>

  <label>Repayment Start Date</label>
  <input type="date" id="repayStart" required>

  <label>Repayment End Date</label>
  <input type="date" id="repayEnd" required>

  <small>ℹ Repayment starts after a 2-month grace period as per Avadhi Nidhi rules.</small>

  <div class="summary" id="summaryMessage"></div>

  <label>Signature</label>
  <canvas id="signatureCanvas"></canvas>
  <button type="button" class="secondary" style="margin-top:10px" onclick="clearSignature()">Clear Signature</button>

  <div class="button-row">
    <button type="button" onclick="downloadPDF()">Download PDF</button>
    <button type="button" class="secondary" onclick="shareOnWhatsApp()">WhatsApp Share</button>
    <button type="button" class="secondary" onclick="window.print()">Print</button>
    <button type="reset" class="secondary" onclick="clearSignature()">Reset</button>
  </div>
</form>

<script>
const { jsPDF } = window.jspdf;
let canvas, ctx, drawing = false;

// Initialize Elements
const nameInput = document.getElementById("applicantName");
const amountInput = document.getElementById("amount");
const monthsInput = document.getElementById("months");
const loanDateInput = document.getElementById("loanDate");
const repayStart = document.getElementById("repayStart");
const repayEnd = document.getElementById("repayEnd");
const summaryMessage = document.getElementById("summaryMessage");
const emiPreview = document.getElementById("emiPreview");

/* ---------- Signature Logic ---------- */
function initCanvas() {
  canvas = document.getElementById("signatureCanvas");
  ctx = canvas.getContext("2d");
  
  // Set actual drawing resolution
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;

  ctx.strokeStyle = "#000";
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: clientX - rect.left,
    y: clientY - rect.top
  };
}

function startDrawing(e) {
  e.preventDefault();
  drawing = true;
  const pos = getPos(e);
  ctx.beginPath();
  ctx.moveTo(pos.x, pos.y);
}

function draw(e) {
  if (!drawing) return;
  e.preventDefault();
  const pos = getPos(e);
  ctx.lineTo(pos.x, pos.y);
  ctx.stroke();
}

function stopDrawing() {
  drawing = false;
}

function clearSignature() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function hasSignature() {
  const blank = document.createElement('canvas');
  blank.width = canvas.width;
  blank.height = canvas.height;
  return canvas.toDataURL() !== blank.toDataURL();
}

/* ---------- Form Logic ---------- */
function updateEMI() {
  if(amountInput.value && monthsInput.value){
    const emi = (amountInput.value / monthsInput.value).toFixed(2);
    emiPreview.innerText = `Estimated EMI: AED ${emi} × ${monthsInput.value} months`;
    emiPreview.classList.remove("hidden");
  }
}

function autoDates() {
  if(!loanDateInput.value || !monthsInput.value) return;
  const d = new Date(loanDateInput.value);
  d.setMonth(d.getMonth() + 2); // 2-month grace
  repayStart.valueAsDate = d;
  
  const e = new Date(d);
  e.setMonth(e.getMonth() + Number(monthsInput.value));
  repayEnd.valueAsDate = e;
}

function generateSummary() {
  const reason = document.getElementById("reason").value;
  const other = document.getElementById("otherReason").value;
  const finalReason = reason === "Other" ? other : reason;
  
  if(!nameInput.value || !amountInput.value) return;
  
  summaryMessage.innerText = 
`Dear Avadhi Nidhi Committee,

I request a loan of AED ${amountInput.value} for ${finalReason || '...'}.
I will repay the loan fully by ${repayEnd.value || '...'}.

Requested by,
${nameInput.value}`;
}

function validateForm() {
  if(!nameInput.value) { alert("Name required"); return false; }
  if(amountInput.value > 2000) { alert("Max amount is 2000"); return false; }
  if(!hasSignature()) { alert("Please provide a signature"); return false; }
  return true;
}

/* ---------- Outputs ---------- */
function downloadPDF() {
  if(!validateForm()) return;
  const doc = new jsPDF();
  doc.setFontSize(18);
  doc.text("Avadhi Nidhi Loan Request", 105, 20, {align:"center"});
  doc.setFontSize(12);
  doc.text(summaryMessage.innerText, 20, 40);
  doc.text("Signature:", 20, 110);
  doc.addImage(canvas.toDataURL("image/png"), 'PNG', 20, 115, 70, 30);
  
  const d = new Date();
  doc.save(`LoanRequest_${nameInput.value}_${d.getTime()}.pdf`);
}

function shareOnWhatsApp() {
  if(!validateForm()) return;
  const text = encodeURIComponent(`Avadhi Nidhi Loan Request\nName: ${nameInput.value}\nAmount: AED ${amountInput.value}\nRepay By: ${repayEnd.value}`);
  window.open(`https://wa.me/?text=${text}`);
}

/* ---------- Init ---------- */
window.onload = () => {
  initCanvas();
  document.getElementById("requestDate").value = new Date().toISOString().split("T")[0];

  // Canvas Events
  canvas.addEventListener("mousedown", startDrawing);
  canvas.addEventListener("mousemove", draw);
  window.addEventListener("mouseup", stopDrawing);

  canvas.addEventListener("touchstart", startDrawing, {passive: false});
  canvas.addEventListener("touchmove", draw, {passive: false});
  window.addEventListener("touchend", stopDrawing);

  // Form Events
  amountInput.oninput = () => {
    document.getElementById("amountError").classList.toggle("hidden", amountInput.value <= 2000);
    updateEMI(); generateSummary();
  };
  monthsInput.oninput = () => { updateEMI(); autoDates(); generateSummary(); };
  loanDateInput.onchange = () => { autoDates(); generateSummary(); };
  nameInput.oninput = generateSummary;
  document.getElementById("reason").onchange = (e) => {
    document.getElementById("otherReasonDiv").classList.toggle("hidden", e.target.value !== "Other");
    generateSummary();
  };
};

// Handle Window Resize for Canvas
window.onresize = initCanvas;
</script>

</body>
</html>
